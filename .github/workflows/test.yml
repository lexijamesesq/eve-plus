name: Test

# Runs each package's unit tests on the PR's own code. Plain pull_request, not pull_request_target: it executes PR
# content, so it gets a read-only token and no secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-microsandbox:
    name: test / sandbox-microsandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install and run the unit tests
        working-directory: packages/sandbox-microsandbox
        run: |
          npm install --no-audit --no-fund
          npm test
