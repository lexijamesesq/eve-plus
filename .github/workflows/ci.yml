name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR's runs group on its ref (refs/pull/<N>/merge), so a new push cancels the
# superseded run. A push to the default branch groups on its own sha and is
# never cancelled: GitHub keeps only one pending run per group, so a shared
# group would silently drop a pending push run -- and with it any job a repo
# adds that must run on every merge, such as a release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Ceiling only: the reusable's own job declares the narrow scopes it
    # actually needs (contents/pull-requests/checks: read, for Jev's triage
    # answer on the head's check-runs) and a called workflow can never exceed
    # what its caller grants. No write scope, no secret: this is the lane a
    # PR controls.
    permissions: read-all
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1

  release-check:
    name: ci / release-check
    # floor: always-run
    # release-check refuses a package change without a version bump;
    # a mechanical PR (a Renovate bump inside a package) can still need one.
    # Refuses a package change without a version bump. PR-time, no writes. Runs
    # on every PR with no `paths:` filter: a path-skipped required check stays
    # Pending forever and blocks every other PR. Cheap when nothing changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check package version discipline
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/check-package-version.sh packages/memory memory || FAILED=1
          exit "$FAILED"

  release-tag:
    name: ci / release-tag
    # Push-time, main only, after the floor passes on the merged commit. Cuts
    # `<package>--v<version>` and its GitHub Release for any package whose
    # declared version isn't tagged yet, so nobody hand-tags. Idempotent (see
    # tag-package-release.sh). contents: write is scoped to this job only.
    if: ${{ (github.event_name == 'push') && needs.floor.outputs.mechanical != 'true' }}
    needs: [floor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # An annotated tag needs a committer identity; a fresh runner has none.
      - name: Configure git identity for the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag and release changed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/tag-package-release.sh packages/memory memory || FAILED=1
          exit "$FAILED"
