name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# The reusable uses one PR concurrency group and cancels superseded runs.
jobs:
  checks:
    name: Shared
    if: github.event_name == 'pull_request_target'
    uses: lexijamesesq/dotty/.github/workflows/estate-pr-ci.yml@v1
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
      MARGOT_APP_KEY: ${{ secrets.MARGOT_APP_KEY }}
      MARGOT_JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
      MARGOT_ANTHROPIC_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}

  release-tag:
    name: ci / release-tag
    # Push-time release job on main. Cuts
    # `<package>--v<version>` and its GitHub Release for any package whose
    # declared version isn't tagged yet, so nobody hand-tags. Idempotent (see
    # tag-package-release.sh). contents: write is scoped to this job only.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # An annotated tag needs a committer identity; a fresh runner has none.
      - name: Configure git identity for the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag and release changed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/tag-package-release.sh packages/memory memory || FAILED=1
          exit "$FAILED"
