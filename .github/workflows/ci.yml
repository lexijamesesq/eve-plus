name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# The reusable uses one PR concurrency group and cancels superseded runs.
jobs:
  checks:
    name: Shared
    if: github.event_name == 'pull_request_target'
    uses: lexijamesesq/dotty/.github/workflows/estate-pr-ci.yml@v1
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
      MARGOT_APP_KEY: ${{ secrets.MARGOT_APP_KEY }}
      MARGOT_JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
      MARGOT_ANTHROPIC_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}

  package:
    name: Package Validation
    needs: checks
    if: needs.checks.outputs.classification != 'mechanical' && needs.checks.outputs.classification != 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: eve-plus-package-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Require the classified PR head
        env:
          CLASSIFICATION: ${{ needs.checks.outputs.classification }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { CLASSIFICATION, HEAD_SHA, EVENT_HEAD, ACTIONS_CACHE_MODE } = process.env;
            if (CLASSIFICATION !== 'functional' || HEAD_SHA !== EVENT_HEAD ||
                !/^[0-9a-f]{40}$/.test(HEAD_SHA ?? '') ||
                !['read', 'none'].includes(ACTIONS_CACHE_MODE)) {
              core.setFailed('Expected a functional PR, matching authenticated head, and read-only or disabled cache access.');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          persist-credentials: false
      # Node 24 and pnpm 12.4.2, as eve-deploy's agents install with; action-setup reads the root packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install each package as a git consumer does, and resolve its exports
        env:
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
        run: bash .github/scripts/check-consumer-install.sh "$HEAD_SHA"

  release-tag:
    name: ci / release-tag
    # Push-time release job on main. Cuts
    # `<package>--v<version>` and its GitHub Release for any package whose
    # declared version isn't tagged yet, so nobody hand-tags. Idempotent (see
    # tag-package-release.sh). contents: write is scoped to this job only.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # An annotated tag needs a committer identity; a fresh runner has none.
      - name: Configure git identity for the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag and release changed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/tag-package-release.sh packages/memory memory || FAILED=1
          bash .github/scripts/tag-package-release.sh packages/sandbox-microsandbox sandbox-microsandbox || FAILED=1
          bash .github/scripts/tag-package-release.sh packages/commissioning commissioning || FAILED=1
          exit "$FAILED"
