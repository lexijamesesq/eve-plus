packages:
  - packages/*

# better-sqlite3 13 ships its platform bindings and has no install script.
# Deny pnpm's inferred node-gyp rebuild during workspace and Git preparation.
allowBuilds:
  better-sqlite3: false

# No release-age gate: whether a new release has settled is decided when it's adopted, not by a blanket delay.
minimumReleaseAge: 0
